[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "latch-fpga"
version = "0.1.0"
description = "LLM-Assisted Timing Closure Harness: shared runtime and isolated research packages"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE.txt", "LICENSE-APACHE-2.0.txt", "LICENSE-MCP-MIT.txt", "LICENSING.md", "SOURCE_CREDITS.md"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4", "pexpect>=4.8"]
openai = ["openai>=1"]
anthropic = ["anthropic>=0.40"]
google = ["google-genai>=1"]
tools = ["mcp>=1", "rapidwright>=2025.2.1", "pexpect>=4.8"]
analysis = ["matplotlib>=3.8", "pandas>=2", "numpy>=1.26", "scipy>=1.11"]

[tool.setuptools]
# Source-backed validation and MCP transport compatibility modules. Physical
# execution still requires the complete source checkout and explicit tools.
py-modules = ["validate_dcps", "mcp_stdio_asyncio"]

[tool.setuptools.packages.find]
include = ["optimizer_pipeline*", "integrations*", "experiments.ablation*", "experiments.dof*", "experiments.acceptance*", "experiments.llm*", "experiments.tuning*"]

[tool.setuptools.package-data]
"integrations.llm.runtime" = ["data/providers/*.json", "data/pricing/*.json"]
"experiments.ablation" = ["configs/*.json", "runtime/knowledge/data/*.json"]
"experiments.dof" = ["configs/*.json"]
"experiments.acceptance" = ["*.json"]
